name: Build Flutter APK
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL to ZIP file'
        required: true
      build_type:
        description: 'Build type (debug/release)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download ZIP
        run: curl -L -o project.zip "${{ github.event.inputs.zip_url }}"

      - name: Unzip
        run: unzip project.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK
        working-directory: ./project
        run: |
          flutter pub get
          if [ "${{ github.event.inputs.build_type }}" == "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: project/build/app/outputs/flutter-apk/app-*.apk
