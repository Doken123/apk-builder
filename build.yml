name: Build Flutter APK
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL to ZIP file'
        required: true
      build_type:
        description: 'Build type (debug/release)'
        required: true
      app_name:
        description: 'New App Name (Leave empty to keep original)'
        required: false
      icon_url:
        description: 'URL to Icon (Leave empty to keep original)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Download File ZIP dari GitHub Release
      - name: Download ZIP
        run: curl -L -o project.zip "${{ github.event.inputs.zip_url }}"

      # 2. Ekstrak File ZIP
      - name: Unzip
        run: unzip project.zip -d project

      # 3. Setup Java (Wajib untuk build Android)
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Setup Flutter & Aktifkan Cache (Biar Build Cepat)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true 

      # 5. Ganti Nama Aplikasi (Jika diisi)
      - name: Modify App Name
        if: ${{ github.event.inputs.app_name != '' }}
        run: |
          cd project
          MANIFEST=$(find . -name "AndroidManifest.xml" | head -n 1)
          if [ -n "$MANIFEST" ]; then
            sed -i "s/android:label=\"[^\"]*\"/android:label=\"${{ github.event.inputs.app_name }}\"/g" $MANIFEST
          fi

      # 6. Ganti Icon/Logo APK (Jika diisi)
      - name: Modify App Icon
        if: ${{ github.event.inputs.icon_url != '' }}
        run: |
          cd project
          curl -L -o icon.png "${{ github.event.inputs.icon_url }}"
          
          # Install ImageMagick untuk resize gambar
          sudo apt-get update && sudo apt-get install -y imagemagick
          
          # Cari folder mipmap dan sesuaikan ukuran gambarnya
          for dir in $(find . -type d -name "mipmap-*"); do
            if [[ "$dir" == *"hdpi"* ]] && [[ "$dir" != *"xhdpi"* ]] && [[ "$dir" != *"xxhdpi"* ]] && [[ "$dir" != *"xxxhdpi"* ]]; then size=72;
            elif [[ "$dir" == *"xhdpi"* ]] && [[ "$dir" != *"xxhdpi"* ]] && [[ "$dir" != *"xxxhdpi"* ]]; then size=96;
            elif [[ "$dir" == *"xxhdpi"* ]] && [[ "$dir" != *"xxxhdpi"* ]]; then size=144;
            elif [[ "$dir" == *"xxxhdpi"* ]]; then size=192;
            else size=48; fi
            
            # Timpa icon bawaan pakai icon baru
            if [ -f "$dir/ic_launcher.png" ]; then
              convert icon.png -resize ${size}x${size} "$dir/ic_launcher.png"
            fi
          done

      # 7. Proses Build APK (Debug / Release)
      - name: Build APK
        working-directory: ./project
        run: |
          flutter pub get
          if [ "${{ github.event.inputs.build_type }}" == "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      # 8. Ambil dan Upload File APK
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: project/build/app/outputs/flutter-apk/app-*.apk
