name: Web to APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "URL website target"
        required: true
        type: string
      app_name:
        description: "Nama aplikasi"
        required: true
        type: string
      icon_url:
        description: "URL icon PNG"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          flutter create \
            --org com.web2apk \
            --project-name webapp \
            --platforms android \
            webapp

      - name: Install dependencies
        working-directory: webapp
        run: |
          flutter pub add webview_flutter
          pip install pillow

      - name: Write main.dart (WebView)
        env:
          WEB_URL: ${{ inputs.web_url }}
        run: |
          cat > webapp/lib/main.dart <<'DART_EOF'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const WebApp());

          class WebApp extends StatelessWidget {
            const WebApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                home: const WebViewScreen(),
              );
            }
          }

          class WebViewScreen extends StatefulWidget {
            const WebViewScreen({super.key});
            @override
            State<WebViewScreen> createState() => _WebViewScreenState();
          }

          class _WebViewScreenState extends State<WebViewScreen> {
            late final WebViewController _controller;

            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0x00000000))
                ..loadRequest(Uri.parse(const String.fromEnvironment('WEB_URL', defaultValue: '')));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: WebViewWidget(controller: _controller),
                ),
              );
            }
          }
          DART_EOF

      - name: Inject WEB_URL ke main.dart
        env:
          WEB_URL: ${{ inputs.web_url }}
        run: |
          python3 <<PY
          import os
          web_url = os.environ['WEB_URL']
          path = 'webapp/lib/main.dart'
          with open(path) as f:
              content = f.read()
          content = content.replace(
              "Uri.parse(const String.fromEnvironment('WEB_URL', defaultValue: ''))",
              f"Uri.parse({web_url!r})"
          )
          with open(path, 'w') as f:
              f.write(content)
          print('✅ WEB_URL injected')
          PY

      - name: Set app name & INTERNET permission
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          python3 <<'PY'
          import os, re, html
          app_name = os.environ['APP_NAME']

          manifest = 'webapp/android/app/src/main/AndroidManifest.xml'
          with open(manifest) as f:
              content = f.read()

          # Ganti android:label
          content = re.sub(r'android:label="[^"]*"',
                           f'android:label="{html.escape(app_name)}"', content)

          # Pastikan ada INTERNET permission
          if 'android.permission.INTERNET' not in content:
              content = content.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.INTERNET"/>\n    <application',
                  1
              )
          with open(manifest, 'w') as f:
              f.write(content)

          # strings.xml
          strings = 'webapp/android/app/src/main/res/values/strings.xml'
          if os.path.exists(strings):
              with open(strings) as f:
                  s = f.read()
              s = re.sub(r'<string name="app_name">[^<]*</string>',
                         f'<string name="app_name">{html.escape(app_name)}</string>', s)
              with open(strings, 'w') as f:
                  f.write(s)

          print(f'✅ App name: {app_name}')
          PY

      - name: Download & resize icon
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ICON_URL: ${{ inputs.icon_url }}
        run: |
          curl -L --fail \
            -H "Authorization: token $GH_TOKEN" \
            -o /tmp/icon.png "$ICON_URL"

          python3 <<'PY'
          from PIL import Image
          import os

          img = Image.open('/tmp/icon.png').convert('RGBA')
          sizes = {
              'mdpi': 48, 'hdpi': 72, 'xhdpi': 96,
              'xxhdpi': 144, 'xxxhdpi': 192,
          }
          for density, size in sizes.items():
              folder = f'webapp/android/app/src/main/res/mipmap-{density}'
              os.makedirs(folder, exist_ok=True)
              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(f'{folder}/ic_launcher.png')
              resized.save(f'{folder}/ic_launcher_round.png')
          print('✅ Icon generated untuk 5 density')
          PY

      - name: Build APK
        working-directory: webapp
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-apk
          path: webapp/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 3
