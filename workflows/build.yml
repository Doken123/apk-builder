name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      release_url:
        description: "URL release ZIP (dari bot)"
        required: true
        type: string
      tag:
        description: "Tag build (dari bot)"
        required: true
        type: string
      build_type:
        description: "Mode build"
        required: true
        default: "release"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download source ZIP dari Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p source
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.zip" \
            --dir source
          echo "📦 File terunduh:"
          ls -la source/

      - name: Extract ZIP & deteksi project dir
        run: |
          mkdir -p work
          unzip -q source/*.zip -d work

          PUB_DIR=$(find work -name "pubspec.yaml" -maxdepth 5 -type f | head -1)
          if [ -z "$PUB_DIR" ]; then
            echo "❌ pubspec.yaml tidak ditemukan di dalam ZIP"
            echo "---- isi ZIP ----"
            ls -R work | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUB_DIR")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "📁 Project dir: $PROJECT_DIR"

      - name: Flutter pub get
        run: |
          cd "${{ env.PROJECT_DIR }}"
          flutter pub get

      - name: Build APK
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          cd "${{ env.PROJECT_DIR }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 3
